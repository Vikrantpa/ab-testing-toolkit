[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "abtest-toolkit"
version = "0.1.0"
description = "A rigorous A/B-testing toolkit: power analysis, CUPED, and always-valid sequential testing."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Your Name" }]
keywords = ["ab-testing", "experimentation", "statistics", "cuped", "sequential-testing", "data-science"]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
]

[project.optional-dependencies]
demo = ["matplotlib>=3.7"]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["abtest*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
